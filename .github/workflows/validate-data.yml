name: Validate catalog

# Installed apps fetch data/*.json directly, so a bad merge reaches users within
# hours. This gate runs before merge; the app's own validation is the fallback.
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'data/**'
      - 'schema/**'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog JSON
        run: python schema/validate.py

      # Separate step, and separate from the structural checks above, because
      # this one reaches the CDN. Keeping it distinct means a red build here
      # reads as "the data does not match reality" rather than "the JSON is
      # malformed" -- two very different things to go and fix.
      #
      # Catches the failure that motivated it: songs.json declaring a file size
      # from the seed catalog while the real MP3 was a quarter of that, which
      # made the song impossible to set as a ringtone with no visible reason.
      - name: Verify audio and images exist and match their metadata
        run: python schema/validate.py --check-audio

      # The share pages are pre-generated because WhatsApp and Facebook
      # crawlers do not run JavaScript -- a client-rendered page would preview
      # every shared link with generic site metadata instead of the song.
      # Since they are generated, they can go stale, and a stale share page is
      # invisible until someone shares a link and gets the wrong preview.
      #
      # if: always() because these checks are INDEPENDENT. Audio is uploaded on
      # a different schedule from the catalog edits, so that step can sit red
      # for days -- and while it did, this one was silently skipped, leaving
      # page drift completely unguarded exactly when songs.json was changing.
      # A gate that stops running because a different gate is red is not a gate.
      - name: Verify the generated share pages are up to date
        if: always()
        run: python schema/generate-pages.py --check

      # --- the audio standard (plan section 17) --------------------------------
      #
      # The step above proves the file EXISTS and is the declared size. It sends a
      # HEAD request, so it cannot see inside the file: a song in stereo, at 44.1
      # kHz, or 6 dB louder than everything else passes it without a word. Those
      # are the faults nobody reports and everybody hears.
      #
      # Section 17 requires this to BLOCK: "CI must fail when any active published
      # song violates the standard... A file that only warns is a file that ships."
      # Until now check-audio-spec existed only as a script on the backend host, run
      # by hand, which is the same as not existing.
      #
      # Cached because audio filenames carry a content hash and a version and are
      # served immutably, so a path that measured clean can never change. Steady
      # state downloads nothing; only new or re-versioned audio is fetched.
      - name: Restore previously verified audio
        if: always()
        uses: actions/cache@v4
        with:
          path: .audio-spec-cache.json
          key: audio-spec-${{ hashFiles('data/songs.json') }}
          restore-keys: audio-spec-

      - name: Install ffmpeg
        if: always()
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # if: always() for the same reason as the step above it.
      - name: Measure published audio against the house standard
        if: always()
        run: python schema/check-audio-spec.py
